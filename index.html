    0% { box-shadow: 0 0 0 0 rgba(239,68,68,0.5); }
    70% { box-shadow: 0 0 0 14px rgba(239,68,68,0); }
    100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); }
  }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }

  /* Avatar "hablando": aparece, pulsa y muestra ondas de sonido mientras suena la voz */
  #avatarWrap.is-visible {
    max-height: 10rem;
    opacity: 1;
    transform: scale(1);
    padding-top: 0.25rem;
    padding-bottom: 0.75rem;
  }

  .avatar-ring {
    border: 3px solid rgba(2, 132, 199, 0.55);
    opacity: 0;
  }
  #avatarWrap.is-speaking .avatar-ring {
    animation: avatar-pulse 1.6s ease-out infinite;
  }
  #avatarWrap.is-speaking .avatar-ring-delay {
    animation-delay: 0.8s;
  }
  @keyframes avatar-pulse {
    0%   { transform: scale(0.9); opacity: 0.7; }
    100% { transform: scale(1.45); opacity: 0; }
  }

  #soundWave { opacity: 0; transition: opacity 0.2s ease; }
  #avatarWrap.is-speaking #soundWave { opacity: 1; }

  .wave-bar {
    width: 4px;
    height: 6px;
    border-radius: 2px;
    background: #0284c7;
    display: inline-block;
  }
  #avatarWrap.is-speaking .wave-bar {
    animation: wave-bounce 0.9s ease-in-out infinite;
  }
  #avatarWrap.is-speaking .wave-bar:nth-child(1) { animation-delay: 0s; }
  #avatarWrap.is-speaking .wave-bar:nth-child(2) { animation-delay: 0.12s; }
  #avatarWrap.is-speaking .wave-bar:nth-child(3) { animation-delay: 0.24s; }
  #avatarWrap.is-speaking .wave-bar:nth-child(4) { animation-delay: 0.36s; }
  #avatarWrap.is-speaking .wave-bar:nth-child(5) { animation-delay: 0.48s; }
  @keyframes wave-bounce {
    0%, 100% { height: 6px; }
    50%      { height: 20px; }
  }
</style>
</head>

const KEYWORDS = [
  { es: "hotel", ro: "hotel", en: "hotel" },
  { es: "habitación", ro: "cameră", en: "room" },
  { es: "reserva", ro: "rezervare", en: "reservation" },

  { es: "agua", ro: "apă", en: "water" },

  { es: "tren", ro: "tren", en: "train" },

const SPEECH_LANG = { es: "es-ES", ro: "ro-RO", en: "en-US" };
const LANG_NAME = { es: "Español", ro: "Română", en: "English" };

/* ========================================================================
   ELEMENTOS DOM
   ======================================================================== */
const langFrom = document.getElementById('langFrom');
const langTo = document.getElementById('langTo');
const swapBtn = document.getElementById('swapBtn');
const inputText = document.getElementById('inputText');
const outputText = document.getElementById('outputText');
const micBtn = document.getElementById('micBtn');
const translateBtn = document.getElementById('translateBtn');
const repeatBtn = document.getElementById('repeatBtn');
const statusBox = document.getElementById('statusBox');
const fromLabel = document.getElementById('fromLabel');
const toLabel = document.getElementById('toLabel');
const quickPhrases = document.getElementById('quickPhrases');
const replyFromLabel = document.getElementById('replyFromLabel');
const replyToLabel = document.getElementById('replyToLabel');
const replyOriginal = document.getElementById('replyOriginal');
const replyTranslated = document.getElementById('replyTranslated');
const micReplyBtn = document.getElementById('micReplyBtn');
const repeatReplyBtn = document.getElementById('repeatReplyBtn');

let lastTranslation = "";
let lastToLang = "ro";
let lastReplyTranslation = "";
let lastReplyLang = "es";

/* ========================================================================
   UI: labels y frases rápidas
   ======================================================================== */
function updateLabels() {
  fromLabel.textContent = `Texto original (${LANG_NAME[langFrom.value]})`;
  toLabel.textContent = `Traducción (${LANG_NAME[langTo.value]})`;
  replyFromLabel.textContent = `🗣️ Respuesta del interlocutor (${LANG_NAME[langTo.value]})`;
  replyToLabel.textContent = `➡️ Traducción para ti (${LANG_NAME[langFrom.value]})`;
}

function renderQuickPhrases() {
  quickPhrases.innerHTML = "";
  const from = langFrom.value;
  PHRASES.slice(0, 12).forEach(p => {
    const btn = document.createElement('button');
    btn.className = "text-xs bg-slate-100 hover:bg-sky-100 text-slate-600 px-2.5 py-1.5 rounded-full border border-slate-200 transition";
    btn.textContent = p[from];
    btn.onclick = () => {
      inputText.value = p[from];
      doTranslate();
    };
    quickPhrases.appendChild(btn);
  });
}

function setStatus(msg) {
  statusBox.textContent = msg;
}

langFrom.addEventListener('change', () => { updateLabels(); renderQuickPhrases(); });
langTo.addEventListener('change', updateLabels);

swapBtn.addEventListener('click', () => {
  const tmp = langFrom.value;
  langFrom.value = langTo.value;
  langTo.value = tmp;
  const tmpText = inputText.value;
  inputText.value = outputText.value;
  outputText.value = tmpText;
  updateLabels();
  renderQuickPhrases();
});

/* ========================================================================
   TRADUCCIÓN — API gratuita MyMemory (sin clave, sin coste, sin registro)
   Traduce cualquier frase libre con gramática real. Si no hay conexión,
   se avisa claramente al usuario (no hay traducción "inventada").
   ======================================================================== */
async function callTranslateAPI(text, from, to) {
  const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${from}|${to}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error("network-error");
  const data = await res.json();
  const translated = data && data.responseData && data.responseData.translatedText;
  if (!translated || typeof translated !== "string") throw new Error("bad-response");
  // MyMemory a veces devuelve un mensaje de aviso en vez de traducción real
  if (/MYMEMORY WARNING/i.test(translated)) throw new Error("quota-warning");
  return translated;
}

let translateInFlight = false;

// Bloquea los selectores de idioma y el botón de invertir mientras hay una
// grabación o traducción en curso, para que el par de idiomas no pueda
// cambiar a medio camino (lo que causaría traducir en la dirección equivocada).
function lockLanguageControls(locked) {
  langFrom.disabled = locked;
  langTo.disabled = locked;
  swapBtn.disabled = locked;
  swapBtn.classList.toggle('opacity-40', locked);
}

async function doTranslate() {
  // Los idiomas se fijan AQUÍ, en el instante del click, y no vuelven a leerse
  // después, para evitar traducir con un par de idiomas distinto al mostrado.
  const from = langFrom.value;
  const to = langTo.value;
  const text = inputText.value.trim();

  if (!text) {
    setStatus("Escribe o dicta un texto para traducir.");
    return;
  }

  if (from === to) {
    outputText.value = text;
    setStatus("Los idiomas de origen y destino son iguales.");
    speak(text, to);
    return;
  }

  if (translateInFlight) return;
  translateInFlight = true;
  translateBtn.disabled = true;
  translateBtn.classList.add('opacity-70');
  lockLanguageControls(true);
  setStatus(`🌐 Traduciendo ${LANG_NAME[from]} → ${LANG_NAME[to]}...`);

  try {
    const translated = await callTranslateAPI(text, from, to);
    outputText.value = translated;
    lastTranslation = translated;
    lastToLang = to;
    setStatus("✅ Traducido");
    speak(translated, to);
  } catch (err) {
    outputText.value = "";
    setStatus("⚠️ No se pudo traducir. Comprueba tu conexión a internet e inténtalo de nuevo.");
  } finally {
    translateInFlight = false;
    translateBtn.disabled = false;
    translateBtn.classList.remove('opacity-70');
    lockLanguageControls(false);
  }
}

translateBtn.addEventListener('click', doTranslate);
inputText.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    doTranslate();
  }
});

/* ========================================================================
   SÍNTESIS DE VOZ (obligatoria en cada traducción)
   ======================================================================== */
const avatarWrap = document.getElementById('avatarWrap');
const avatarImg = document.getElementById('avatarImg');
const headerLogo = document.getElementById('headerLogo');
// Reutiliza la misma imagen incrustada del logo, sin duplicar el archivo.
if (avatarImg && headerLogo) avatarImg.src = headerLogo.src;

function showAvatarSpeaking() {
  if (!avatarWrap) return;
  avatarWrap.classList.add('is-visible', 'is-speaking');
}

function hideAvatarSpeaking() {
  if (!avatarWrap) return;
  avatarWrap.classList.remove('is-speaking');
  // Se oculta del todo un instante después, para que la animación no corte en seco.
  setTimeout(() => {
    if (!avatarWrap.classList.contains('is-speaking')) {
      avatarWrap.classList.remove('is-visible');
    }
  }, 250);
}

function speak(text, langCode) {
  if (!('speechSynthesis' in window)) {
    setStatus("Tu navegador no soporta síntesis de voz.");
    return;
  }
  window.speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = SPEECH_LANG[langCode] || "en-US";
  utterance.rate = 0.95;
  utterance.pitch = 1;

  // Intentar elegir una voz específica del idioma si existe
  const voices = window.speechSynthesis.getVoices();
  const match = voices.find(v => v.lang === utterance.lang) ||
                voices.find(v => v.lang.startsWith(langCode));
  if (match) utterance.voice = match;

  // El avatar aparece y "habla" (pulso + ondas) mientras dura la locución.
  utterance.onstart = showAvatarSpeaking;
  utterance.onend = hideAvatarSpeaking;
  utterance.onerror = hideAvatarSpeaking;

  window.speechSynthesis.speak(utterance);
}

repeatBtn.addEventListener('click', () => {
  if (lastTranslation) {
    speak(lastTranslation, lastToLang);
  } else if (outputText.value.trim()) {
    speak(outputText.value.trim(), langTo.value);
  } else {
    setStatus("Aún no hay traducción para repetir.");
  }
});

repeatReplyBtn.addEventListener('click', () => {
  if (lastReplyTranslation) {
    speak(lastReplyTranslation, lastReplyLang);
  } else if (replyTranslated.value.trim()) {
    speak(replyTranslated.value.trim(), langFrom.value);
  } else {
    setStatus("Aún no hay respuesta traducida para repetir.");
  }
});

// Precargar voces (algunos navegadores las cargan de forma asíncrona)
if ('speechSynthesis' in window) {
  window.speechSynthesis.onvoiceschanged = () => {
    window.speechSynthesis.getVoices();
  };
}

/* ========================================================================
   RECONOCIMIENTO DE VOZ
   ======================================================================== */
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let isListening = false;
let recognitionMode = "main"; // "main" = tú hablas | "reply" = habla el interlocutor
let recognitionFrom = "es";   // idioma de origen fijado al pulsar el micrófono
let recognitionTo = "ro";     // idioma de destino fijado al pulsar el micrófono
let recognitionGotResult = false;

function setMicButtonState(btn, listening) {
  if (listening) {
    btn.classList.add('mic-pulse');
    btn.textContent = "⏺️";
  } else {
    btn.classList.remove('mic-pulse');
    btn.textContent = "🎤";
  }
}

if (SpeechRecognition) {
  recognition = new SpeechRecognition();
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  recognition.onstart = () => {
    isListening = true;
    if (recognitionMode === "main") {
      setMicButtonState(micBtn, true);
      setStatus("🎙️ Escuchando... (tú)");
    } else {
      setMicButtonState(micReplyBtn, true);
      setStatus(`🎙️ Escuchando al interlocutor en ${LANG_NAME[langTo.value]}...`);
    }
  };

  recognition.onresult = async (event) => {
    recognitionGotResult = true;
    const transcript = event.results[0][0].transcript;

    if (recognitionMode === "main") {
      inputText.value = transcript;
      setStatus("Texto reconocido. Traduciendo...");
      doTranslate();
    } else {
      // La respuesta del interlocutor va del idioma "to" hacia el idioma "from",
      // usando los idiomas fijados al pulsar el micrófono (no los actuales).
      replyOriginal.value = transcript;
      const from = recognitionFrom;
      const to = recognitionTo;
      setStatus(`🌐 Traduciendo respuesta ${LANG_NAME[from]} → ${LANG_NAME[to]}...`);

      try {
        const translated = await callTranslateAPI(transcript, from, to);
        replyTranslated.value = translated;
        lastReplyTranslation = translated;
        lastReplyLang = to;
        setStatus("✅ Respuesta traducida");
        speak(translated, to);
      } catch (err) {
        replyTranslated.value = "";
        setStatus("⚠️ No se pudo traducir la respuesta. Comprueba tu conexión a internet.");
      } finally {
        lockLanguageControls(false);
      }
    }
  };

  recognition.onerror = (event) => {
    setStatus("⚠️ Error de reconocimiento: " + event.error);
    lockLanguageControls(false);
  };

  recognition.onend = () => {
    isListening = false;
    setMicButtonState(micBtn, false);
    setMicButtonState(micReplyBtn, false);
    // Si no se reconoció nada (grabación cancelada o sin voz detectada),
    // liberamos el bloqueo de idiomas aquí; si sí hubo resultado, el propio
    // flujo de traducción (doTranslate o el bloque "reply") ya lo libera.
    if (!recognitionGotResult) {
      lockLanguageControls(false);
    }
  };
} else {
  micBtn.disabled = true;
  micBtn.classList.add('opacity-40', 'cursor-not-allowed');
  micReplyBtn.disabled = true;
  micReplyBtn.classList.add('opacity-40', 'cursor-not-allowed');
}

// Limpia todo rastro de la conversación anterior (textos, traducciones y
// cualquier voz que se esté reproduciendo) para empezar una conversación
// nueva cada vez que se pulsa un micrófono.
function resetConversation() {
  window.speechSynthesis.cancel();

  inputText.value = "";
  outputText.value = "";
  replyOriginal.value = "";
  replyTranslated.value = "";

  lastTranslation = "";
  lastReplyTranslation = "";

  setStatus("");
}

function startListening(mode) {
  if (!recognition) {
    setStatus("Tu navegador no soporta reconocimiento de voz. Prueba con Chrome.");
    return;
  }
  if (isListening) {
    recognition.stop();
    return;
  }

  // Nueva grabación => nueva conversación: se borra todo lo anterior.
  resetConversation();

  // Los idiomas se fijan AQUÍ, en el instante de pulsar el micrófono, y los
  // selectores quedan bloqueados hasta que termine todo el proceso, para que
  // no puedan cambiar mientras se graba o se traduce.
  recognitionMode = mode;
  if (mode === "main") {
    recognitionFrom = langFrom.value;
    recognitionTo = langTo.value;
  } else {
    recognitionFrom = langTo.value;
    recognitionTo = langFrom.value;
  }
  recognition.lang = SPEECH_LANG[recognitionFrom] || "es-ES";
  recognitionGotResult = false;
  lockLanguageControls(true);

  try {
    recognition.start();
  } catch (e) {
    setStatus("No se pudo iniciar el micrófono.");
    lockLanguageControls(false);
  }
}

micBtn.addEventListener('click', () => startListening("main"));
micReplyBtn.addEventListener('click', () => startListening("reply"));

/* ========================================================================
   INIT
   ======================================================================== */
updateLabels();
renderQuickPhrases();
setStatus("Selecciona idiomas y escribe o habla una frase de viaje.");

// Registro del service worker: necesario para que Android/Chrome permita
// instalar la app con icono real (WebAPK), no solo un acceso directo.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {
      // Si falla (por ejemplo al abrir el archivo localmente sin https),
      // la app sigue funcionando igual, solo sin la opción de instalación completa.
    });
  });
}
</script>
